name: Draft a release note
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  draft_release:
    name: Release Drafter
    runs-on: ubuntu-latest

    permissions:
      # write permission is required to create a github release
      contents: write
      # read permission is required to collect the merged pull requests
      pull-requests: read

    steps:
      - name: Run release-drafter
        uses: release-drafter/release-drafter@v7.11.0
