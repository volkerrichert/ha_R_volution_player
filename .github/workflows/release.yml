name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0

      - name: "Only release from main"
        shell: "bash"
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} is not on main. Releases are only built from main."
            exit 1
          fi

      - name: "Adjust version number"
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"' \
            "${{ github.workspace }}/custom_components/r_volution_player/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/r_volution_player"
          zip hacs-r-volution-player.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: ${{ github.workspace }}/custom_components/r_volution_player/hacs-r-volution-player.zip
